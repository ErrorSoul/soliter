<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<!-- viewport-fit=cover есть в стоковом шаблоне, а в нашем форке потерялся: без него
	     на телефонах с вырезом канвас упирается в safe-area и по краям остаются поля. -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">

	<!-- Подстановки движка. Шаблон — форк стокового builtins/manifests/web/engine_template.html,
	     и в нём эти четыре места были ЗАПЕЧЕНЫ значениями (имя игры, версия, размер канваса).
	     Это мина: переименуй игру в game.project — bob соберёт NewName.js, а загрузчик так и
	     будет просить ShenzenSolitare.js, и HTML5-сборка молча перестанет запускаться.
	     Возвращены плейсхолдеры; подстановка проверена на настоящей сборке. -->
	<title>{{project.title}} {{project.version}}</title>
	<style type='text/css'>
	/* Требование Я.Игр (D2): страница не должна прокручиваться, пружинить и
	   перезагружаться жестом. Это НЕ раскладка — ни размеры, ни позиции здесь
	   не меняются, только реакция браузера на жест. */
	html, body {
		overscroll-behavior: none;
	}

	body {
		position: fixed;
		margin:0;
		padding:0;
	}

	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}

	.canvas-app-container:-webkit-full-screen {
		width: auto;
		height: auto;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
		/* D2: все жесты над канвасом принадлежат игре — ни скролла, ни
		   двойного тапа для зума, ни pull-to-refresh посреди драга карты. */
		touch-action: none;
	}

	#canvas-container {
		position: relative;
	}

	canvas:focus, canvas:active {
		outline: none;
		border: 0;
		ie-dummy: expression(this.hideFocus=true);
		-moz-outline-style: none;
	}

	body, div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-khtml-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;
	}

	.canvas-app-progress {
		position: absolute;
		background-color: #1a3311;
		height: 6px;
		margin-top: -6px;
		width: 100%;
	}

	.canvas-app-progress-bar {
		font-size: 12px;
		height: 6px;
		color: rgb(255, 255, 255);
		background-color: #2a6622;
		text-align: center;
		line-height: 20px;
		transition: transform 1s ease;
		transform-origin: left;
		transform: scaleX(1.0);
	}

	body {
		background-color: #1a3311;
	}

	.canvas-app-container {
		background: #1a3311;
	}

	.canvas-app-canvas {
		background-color: #1a3311;
	}
	</style>
</head>

<body>

	<div id="app-container" class="canvas-app-container">
		<div id="running-from-file-warning" style="display: none; margin: 3em; color: #aaffaa;">
			<h1>Running from local file ⚠️</h1>
			<p>Open this file from a web server, not by double-clicking.</p>
		</div>
		<div id="webgl-not-supported" style="display: none; margin: 3em; color: #aaffaa;">
			<h1>WebGL not supported ⚠️</h1>
			<p>WebGL is not supported by your browser.</p>
		</div>
		<div id="canvas-container" class="canvas-app-canvas-container">
			<canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="{{display.width}}" height="{{display.height}}"></canvas>
		</div>
	</div>

	<script id='audio-focus-guard' type='text/javascript'>
		// D2: звук обязан гаснуть, когда вкладка ушла в фон или потеряла фокус
		// (требование Я.Игр). Делаем это в шаблоне, а не в Lua: событие
		// window.WINDOW_EVENT_FOCUS_LOST в js-web у нас воспроизводимо не
		// приходило (замерено в headless Chromium — триггер не коррелировал с
		// blur/visibilitychange), а непроверенный путь в релиз не едет.
		//
		// К AudioContext движка не лезем через внутренние символы: перехватываем
		// сам конструктор и держим список созданных контекстов — это не зависит
		// от того, как Defold назвал свои поля. Важно оказаться раньше СТАРТА
		// движка, а не раньше тега dmloader.js: контекст создаётся уже внутри
		// EngineLoader.load, асинхронно (проверено мутацией — перенос этого
		// блока под загрузчик ничего не менял, ctx по-прежнему 1).
		(function () {
			var contexts = [];
			["AudioContext", "webkitAudioContext"].forEach(function (name) {
				var Orig = window[name];
				if (!Orig) { return; }
				function Patched() {
					var ctx = new (Function.prototype.bind.apply(Orig, [null].concat([].slice.call(arguments))))();
					contexts.push(ctx);
					// Ревью блока H (обе модели): без этого вызова контекст, созданный,
					// когда вкладка УЖЕ в фоне или без фокуса, остаётся running до
					// следующего события — то есть игра в фоновой вкладке звучит.
					// Движок создаёт контекст асинхронно внутри EngineLoader.load,
					// так что момент создания — единственное место, где это видно.
					apply();
					return ctx;
				}
				Patched.prototype = Orig.prototype;
				window[name] = Patched;
			});

			// В лог идёт ИЗМЕРЕННОЕ состояние контекстов, а не намерение сторожа.
			// Ревью блока H (grok-4.6): строка «[AUDIO] suspended» печаталась от
			// флага muted, поэтому стенд оставался зелёным, даже если убрать
			// suspend/resume целиком. Теперь стенд читает states=... и такая
			// мутация его роняет. suspend()/resume() асинхронны — состояние
			// снимаем после того, как обещания осели.
			// Ревью блока I (grok-4.5): suspend()/resume() меняют state только
			// после resolve промиса, поэтому два события подряд разъезжались:
			// hidden → suspend() (state ещё "running") → быстрый focus →
			// muted=false, но state всё ещё "running", значит resume() не
			// зовётся → промис доезжает и контекст остаётся глухим до следующего
			// blur/focus. Окно это не теоретическое: apply() теперь зовётся ещё
			// и из конструктора, то есть ровно во время загрузки, когда фокус
			// дёргается чаще всего.
			// Лечим не блокировкой, а перепроверкой: пока операции в полёте,
			// новые вызовы только помечают «переспросить», а после того как
			// промисы осели, сверяем ЖЕЛАЕМОЕ состояние с тем, что было при
			// запуске, и при расхождении заходим ещё раз.
			var applying = false, again = false;
			function apply() {
				if (applying) { again = true; return; }
				applying = true;
				var muted = document.hidden || !document.hasFocus();
				var ops = contexts.map(function (c) {
					if (muted && c.state === "running") { return c.suspend(); }
					if (!muted && c.state === "suspended") { return c.resume(); }
					return null;
				});
				function done() {
					applying = false;
					console.log("[AUDIO] " + (muted ? "suspended" : "resumed") +
						" ctx=" + contexts.length +
						" states=" + contexts.map(function (c) { return c.state; }).join(","));
					var now = document.hidden || !document.hasFocus();
					if (again || now !== muted) { again = false; apply(); }
				}
				Promise.all(ops.map(function (p) {
					return (p && typeof p.then === "function") ? p : Promise.resolve();
				})).then(done, done);
			}

			document.addEventListener("visibilitychange", apply);
			window.addEventListener("blur", apply);
			window.addEventListener("focus", apply);
		})();
	</script>

	<script id='context-menu-guard' type='text/javascript'>
		// D2: долгий тап по карте на мобиле открывал бы контекстное меню прямо
		// посреди перетаскивания, а правая кнопка — на десктопе.
		document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, { passive: false });
	</script>

	<script id='fullscreen-guard' type='text/javascript'>
		// Раздел 3 требований Я.Игр (docs/yandex-requirements.md): «Полноэкранный
		// режим при запуске и в игре». Открытый долг по D2 (plans/launch-global.md).
		//
		// requestFullscreen() браузер принимает ТОЛЬКО синхронно внутри настоящего
		// пользовательского жеста — вызов из кода загрузки браузер молча отклонит.
		// Ловим самый первый жест нативным DOM-обработчиком на document, а не через
		// Lua/GUI: на свежей странице это и есть тап по PLAY (нажимать больше не на
		// что), но решение не привязано к устройству стартового экрана и не требует
		// трогать main.script/cursor.script.
		//
		// pointerup/touchend/click, а не pointerdown/touchstart/mousedown: down-жест
		// тоже даёт активацию в части браузеров, но up-событие — общий знаменатель,
		// который спека признаёт активирующим везде. Слушаем на document в фазе
		// CAPTURE — событие долетает до нас раньше, чем до обработчиков канваса, так
		// что даже если движок внутри вызовет preventDefault(), нашего слушателя это
		// уже не касается.
		//
		// Требование мобильное («жестовое управление», «не промахнуться пальцем») —
		// принудительный fullscreen на десктопе неуместен, там пользователь сам решает
		// про окно/вкладку. Различаем не по User-Agent (спуфится и ничего не
		// гарантирует), а по фактическому вводу: (hover: none) and (pointer: coarse) —
		// грубый указатель БЕЗ курсора с hover, то есть тач как ОСНОВНОЙ способ ввода.
		// Ноутбук с сенсорным экраном и мышью сюда не попадёт (у мыши есть hover), а
		// телефон и планшет — попадут. Замерено: в headless Chromium именно
		// has_touch (не is_mobile) поворачивает этот matchMedia — сценарий `fullscreen`
		// эмулирует мобильный ввод флагом `--mobile` харнесса ровно через has_touch.
		(function () {
			function isMobile() {
				try {
					if (window.matchMedia &&
						window.matchMedia("(hover: none) and (pointer: coarse)").matches) {
						return true;
					}
				} catch (e) {}
				// Резерв на случай браузера без поддержки медиа-фич hover/pointer.
				return /Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent || "");
			}
			if (!isMobile()) {
				return;
			}

			// el/request разрешаются лениво, внутри обработчика, а не здесь: так
			// порядок этого блока относительно #app-container в разметке не важен.
			function requestFn() {
				var el = document.getElementById("app-container");
				return el && (el.requestFullscreen || el.webkitRequestFullscreen ||
					el.mozRequestFullScreen || el.msRequestFullscreen) && el;
			}

			// iOS Safari (и WebView на его движке) не даёт Fullscreen API для
			// произвольных элементов вообще — ни один из вариантов выше там не
			// определён. Осмысленный фолбэк — просто ничего не звать: страница и так
			// растянута на весь вьюпорт (.canvas-app-container 100%/100%, body
			// position:fixed) — это весь "fullscreen", который платформа может дать
			// здесь, без сломанного вызова и мусора в консоли.
			if (!requestFn()) {
				return;
			}

			// "И в игре": один успешный вход держится сам, пока игрок не выйдет сам
			// (Esc/жест ОС) — повторный автовход после РУЧНОГО выхода сознательно не
			// делаем: это отдельная незамеренная логика (fullscreenchange, повторное
			// вооружение слушателей), которую здесь нечем проверить, а непроверенный
			// путь в релиз не едет (тот же принцип, что и у audio-focus-guard выше).
			function tryFullscreen() {
				document.removeEventListener("pointerup", tryFullscreen, true);
				document.removeEventListener("touchend", tryFullscreen, true);
				document.removeEventListener("click", tryFullscreen, true);

				var el = requestFn();
				if (!el) {
					return;
				}
				// В iframe Я.Игр без allow="fullscreen" запрос ОТКЛОНЯЕТСЯ — ожидаемый,
				// безобидный исход, а не ошибка: игра продолжает работать в обычном
				// режиме. fullscreenEnabled — та же проверка заранее, чтобы не дёргать
				// API там, где он гарантированно откажет; сам вызов всё равно обёрнут в
				// try/catch и .catch(), потому что часть браузеров вместо этого просто
				// отклоняет промис без синхронного исключения.
				var enabled = document.fullscreenEnabled;
				if (enabled === undefined) { enabled = document.webkitFullscreenEnabled; }
				if (enabled === false) {
					return;
				}
				var request = el.requestFullscreen || el.webkitRequestFullscreen ||
					el.mozRequestFullScreen || el.msRequestFullscreen;
				try {
					var result = request.call(el);
					if (result && typeof result.catch === "function") {
						result.catch(function () {});
					}
				} catch (e) {
					// безобидно: остаёмся в обычном режиме, ничего не ломаем
				}
			}

			document.addEventListener("pointerup", tryFullscreen, true);
			document.addEventListener("touchend", tryFullscreen, true);
			document.addEventListener("click", tryFullscreen, true);
		})();
	</script>

	<!-- D1: SDK Яндекс.Игр. Путь /sdk.js — от корня хоста-обёртки, так в требованиях
	     платформы. Вне iframe Я.Игр это 404: тег молча не грузится, YaGames не
	     появляется, мост уходит в состояние "absent" и игра работает как обычно. -->
	<script id='ya-sdk' type='text/javascript' src="/sdk.js"></script>
	<script id='ya-bridge' type='text/javascript'>
		// D1: весь промис-код SDK живёт здесь, а не в Lua-строках. html5.run умеет
		// только "выполнить JS и вернуть строку", поэтому Lua опрашивает короткие
		// геттеры (state/lang), а вся асинхронность и парность вызовов — тут.
		//
		// Инициализацию начинаем сразу, не дожидаясь Lua: промис успевает
		// разрешиться, пока грузится движок, и язык доезжает до первой отрисовки.
		window.__ya = (function () {
			var state = "absent";     // absent | pending | ready | failed
			var sdk = null;
			var lang = "";
			var readySent = false;
			var wantGameplay = false; // чего хочет игра (уровень загружен)
			var gameplayOn = false;   // что реально отправлено в SDK
			var trace = [];

			function mark(name) {
				trace.push(name);
				console.log("[YA] " + name);
			}

			function feature(name) {
				// Состав features у песочницы и продакшена отличается — каждый
				// вызов проверяет наличие, а не полагается на схему.
				if (!sdk || !sdk.features) {
					return null;
				}
				var f = sdk.features[name];
				return (f && typeof f === "object") ? f : null;
			}

			function applyGameplay() {
				// Условие НЕ то же, что у сторожа звука выше: тот гасит и по
				// !document.hasFocus(), иначе клик в адресную строку не мьютит
				// вкладку. Для GameplayAPI такой же критерий слал бы в метрики
				// Яндекса start/stop на каждый клик мимо канваса, поэтому здесь
				// только document.hidden. Две разные проверки — намеренно.
				if (state !== "ready") {
					return;
				}
				// Порядок для платформы: сначала LoadingAPI.ready (игра
				// загрузилась), только потом GameplayAPI.start. Игрок успевает
				// нажать PLAY, пока промис SDK ещё не разрешился, — тогда
				// wantGameplay уже true, и без этой проверки start уходил бы
				// раньше ready. Поймано сценарием yasdk с медленным SDK.
				if (!readySent) {
					return;
				}
				var on = wantGameplay && !document.hidden;
				if (on === gameplayOn) {
					return;
				}
				var api = feature("GameplayAPI");
				if (!api) {
					return;
				}
				// Флаг ставим ТОЛЬКО после успешного вызова. Иначе упавший
				// start() оставлял gameplayOn = true, следующий applyGameplay
				// видел «уже включено» и выходил — платформа так и не узнавала о
				// начале партии, и повторить было некому (находка внешнего
				// ревью D1).
				try {
					if (on) {
						api.start();
					} else {
						api.stop();
					}
					gameplayOn = on;
					mark("gameplay-" + (on ? "start" : "stop"));
				} catch (e) {
					mark("gameplay-threw " + e);
				}
			}

			function init() {
				if (typeof YaGames === "undefined" || !YaGames || typeof YaGames.init !== "function") {
					mark("absent");
					return;
				}
				state = "pending";
				var p;
				try {
					p = YaGames.init();
				} catch (e) {
					state = "failed";
					mark("init-threw " + e);
					return;
				}
				p.then(function (s) {
					sdk = s;
					state = "ready";
					try {
						lang = (s.environment && s.environment.i18n && s.environment.i18n.lang) || "";
					} catch (e) {
						lang = "";
					}
					mark("ready lang=" + lang);
					applyGameplay();
				}, function (e) {
					state = "failed";
					mark("init-failed " + e);
				});
			}

			document.addEventListener("visibilitychange", applyGameplay);
			init();

			return {
				state: function () {
					return state;
				},
				lang: function () {
					return lang;
				},
				trace: function () {
					return trace.join(",");
				},
				loadingReady: function () {
					// Ровно один раз за жизнь страницы. Уровень перезагружается
					// сколько угодно — платформе это знать не нужно.
					if (readySent || state !== "ready") {
						return "";
					}
					readySent = true;
					var api = feature("LoadingAPI");
					if (!api) {
						mark("no-LoadingAPI");
						applyGameplay();
						return "";
					}
					try {
						api.ready();
						mark("loading-ready");
					} catch (e) {
						mark("ready-threw " + e);
					}
					// Если PLAY нажали раньше, чем SDK ответил, старт геймплея
					// ждал именно этого момента.
					applyGameplay();
					return "";
				},
				gameplay: function (on) {
					wantGameplay = !!on;
					applyGameplay();
					return "";
				}
			};
		})();
	</script>

	<script id='engine-loader' type='text/javascript' src="dmloader.js"></script>
	<script id='engine-setup' type='text/javascript'>
	</script>
	<script id='engine-start' type='text/javascript'>
		var runningFromFileWarning = document.getElementById("running-from-file-warning");
		if (window.location.href.startsWith("file://")) {
			runningFromFileWarning.style.display = "block";
		}
		else {
			EngineLoader.load("canvas", "{{exe-name}}");
			runningFromFileWarning.parentNode.removeChild(runningFromFileWarning);
		}
	</script>
</body>
</html>
